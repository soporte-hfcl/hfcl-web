<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terreno HFCL - Red</title>
    <!-- Tailwind CSS por CDN para un diseño moderno y responsivo al instante -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/movil.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 flex flex-col justify-between">

    <div class="max-w-md mx-auto w-full space-y-4">
        <!-- Encabezado de la App Móvil -->
        <header class="flex justify-between items-center pb-3 border-b border-slate-800">
            <div>
                <h1 class="text-base font-bold text-sky-400">HFCL Terreno</h1>
                <p class="text-xs text-slate-400">Gestión de Racks y Redes</p>
            </div>
            <span class="text-[10px] bg-sky-950 text-sky-300 border border-sky-800 px-2 py-1 rounded-full font-mono">Modo Móvil</span>
        </header>

        <!-- Buscador Rápido (IP, MAC, Roseta) -->
        <div class="relative">
            <input type="text" id="buscadorTerreno" placeholder="Buscar IP, MAC o Roseta..." 
                class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-sky-500 shadow-inner">
        </div>

        <!-- Tarjeta de Edición / Consulta de Equipo -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-4 shadow-xl">
            <div class="flex justify-between items-start">
                <div>
                    <span id="nombreEquipo" class="font-bold text-white text-base">PC-URGENCIAS-01</span>
                    <div id="ipEquipo" class="text-xs font-mono text-sky-400">10.66.50.12</div>
                </div>
                <span class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded font-medium">Activo</span>
            </div>

            <!-- Datos Técnicos Básicos -->
            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950 p-3 rounded-xl border border-slate-800/60">
                <div><span class="text-slate-500">Marca:</span> <span id="marcaEquipo">Dell OptiPlex</span></div>
                <div><span class="text-slate-500">MAC:</span> <span id="macEquipo" class="font-mono">54:BF:64:...</span></div>
            </div>

            <!-- Sección de Ubicación Física (Modificable en Terreno) -->
            <div class="space-y-3 pt-1">
                <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Ubicación Física y Red</div>
                
                <!-- Roseta / Patch Panel -->
                <div class="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-xl border border-slate-800/60">
                    <label class="text-xs text-slate-400 font-medium">Roseta / PP:</label>
                    <input type="text" id="inputRoseta" value="R-12" class="w-20 bg-slate-900 border border-slate-700 rounded-lg p-1 text-center text-sm font-mono text-white focus:outline-none focus:border-sky-500">
                </div>

                <!-- Switch Asociado -->
                <div class="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-xl border border-slate-800/60">
                    <label class="text-xs text-slate-400 font-medium">Switch:</label>
                    <input type="text" id="inputSwitch" value="SW-Urgencias" class="w-32 bg-slate-900 border border-slate-700 rounded-lg p-1 text-center text-sm font-mono text-white focus:outline-none focus:border-sky-500">
                </div>

                <!-- Puerto del Switch -->
                <div class="flex items-center justify-between bg-slate-950 px-3 py-2 rounded-xl border border-slate-800/60">
                    <label class="text-xs text-slate-400 font-medium">Puerto:</label>
                    <select id="selectPuerto" class="w-24 bg-slate-900 border border-sky-500 rounded-lg p-1 text-center text-sm font-mono text-sky-300 font-bold focus:outline-none">
                        <option value="10">Puerto 10</option>
                        <option value="11">Puerto 11</option>
                        <option value="12" selected>Puerto 12</option>
                        <option value="13">Puerto 13</option>
                        <option value="14">Puerto 14</option>
                    </select>
                </div>
            </div>

            <!-- Botón de Acción Principal -->
            <button onclick="guardarCambiosTerreno()" class="w-full bg-sky-600 hover:bg-sky-500 active:scale-[0.98] text-white font-medium py-3 rounded-xl text-sm transition-all shadow-lg shadow-sky-950 flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span>Guardar y Actualizar Puerto</span>
            </button>
        </div>
    </div>

    <!-- Pie de página discreto -->
    <footer class="text-center text-[10px] text-slate-600 pt-4">
        Hospital Familiar y Comunitario de Lanco &bull; TIC
    </footer>

    <!-- Script JavaScript opcional para simular la acción -->
    <script src="js/movil.js"></script>
</body>
</html>
