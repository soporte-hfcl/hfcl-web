<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HFCL - Terreno & Activos Pro (Móvil)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-blue-500 selection:text-white">

    <!-- Header Fijo Superior -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-slate-200">HFCL // Hospital</h1>
                <p id="header-subtitle" class="text-[10px] text-slate-400">Módulo de Consulta</p>
            </div>
        </div>
        <span id="edit-badge" class="hidden bg-amber-500/10 text-amber-400 text-[11px] px-2 py-1 rounded-md font-semibold border border-amber-500/20">Modo Edición ✏️</span>
    </header>

    <!-- Contenido Principal Dinámico -->
    <main class="p-4 flex-1 max-w-md w-full mx-auto space-y-4 pb-28">
        
        <!-- ================= VISTA 1: CONSULTAR / BUSCAR ================= -->
        <div id="view-consultar" class="space-y-4 view-section">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </span>
                <input type="text" id="globalSearch" placeholder="Buscar IP, Hostname, MAC o Activo..." class="w-full bg-slate-900 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-slate-200 placeholder-slate-500 shadow-inner font-mono">
            </div>

            <!-- Contenedor dinámico de Resultados -->
            <div id="searchResults" class="space-y-3">
                <div class="text-center py-10 text-slate-500 text-xs">
                    <i class="fas fa-spinner fa-spin text-lg mb-2 text-blue-500"></i>
                    <p>Sincronizando dispositivos desde Google Sheets...</p>
                </div>
            </div>
        </div>

        <!-- ================= VISTA 2: REGISTRAR / EDITAR FORMULARIO ================= -->
        <div id="view-registrar" class="space-y-4 view-section hidden">
            <form id="activoForm" class="space-y-4 bg-slate-900/60 border border-slate-800 p-4 rounded-2xl shadow-xl">
                
                <div class="space-y-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 border-b border-slate-800 pb-1">1. Red y Ubicación Física</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Rack</label>
                            <select id="formRack" onchange="filtrarSwitchesPorRack()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                                <option value="">Seleccione Rack...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Switch</label>
                            <select id="formSwitch" onchange="poblarPuertosSelect()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono">
                                <option value="">Seleccione Switch...</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Puerto Switch</label>
        <select id="selectPuerto" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono">
            <option value="">Seleccione puerto...</option>
        </select>
    </div>
    <div>
        <label class="block text-xs text-slate-400 mb-1">Patch Panel / Roseta</label>
        <select id="selectPatchPanel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono">
            <option value="">Cargando desde hoja red...</option>
        </select>
                        </div>
                    </div>
                </div>

                <div class="space-y-3 pt-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 border-b border-slate-800 pb-1">2. Datos Únicos</h2>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Hostname</label>
                        <input type="text" id="inputHostname" placeholder="PC-OIRS-01" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono uppercase">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">IP</label>
                            <input type="text" id="inputIp" placeholder="10.10.X.X" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">MAC</label>
                            <input type="text" id="inputMac" placeholder="XX:XX:XX..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono text-[11px]">
                        </div>
                    </div>
                </div>

                <!-- 3. Clasificación y Atributos Separados Limpiamente -->
                <div class="space-y-3 pt-2">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-blue-400 border-b border-slate-800 pb-1">3. Clasificación y Hardware</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Tipo de Dispositivo</label>
                            <select id="selectTipo" onchange="toggleCamposDinamicos()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                                <option value="">Seleccione tipo...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Marca</label>
                            <select id="selectMarca" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                                <option value="">Seleccione marca...</option>
                            </select>
                        </div>
                    </div>

                    <!-- Campos Técnicos Dinámicos (Solo para PCs / Notebooks) -->
                    <div id="camposComputador" class="space-y-3 hidden pt-2 border-t border-slate-800/60">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Procesador (CPU)</label>
                                <select id="selectCpu" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono">
                                    <option value="">Seleccione CPU...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Memoria RAM</label>
                                <select id="selectRam" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono">
                                    <option value="">Seleccione RAM...</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Tipo Almacenamiento</label>
                                <select id="selectTipoAlm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                                    <option value="">Seleccione tipo...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Capacidad Disco</label>
                                <select id="selectCapAlm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 font-mono">
                                    <option value="">Seleccione capacidad...</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Sistema Operativo</label>
                                <select id="selectSo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                                    <option value="">Seleccione SO...</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Licencia Office</label>
                                <select id="selectOffice" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200">
                                    <option value="">Seleccione Office...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-2">
                    <button type="button" onclick="cancelarEdicion()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl text-xs border border-slate-700 transition">
                        Cancelar ✖
                    </button>
                    <button type="button" onclick="guardarActivoMovil()" class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl text-xs shadow-lg shadow-blue-900/40 transition">
                        Guardar en Sheets 💾
                    </button>
                </div>
            </form>
        </div>

        <!-- ================= VISTA 3: ESTADO DE RACKS ================= -->
        <div id="view-racks" class="space-y-4 view-section hidden">
            <p class="text-xs text-slate-400 text-center py-4">Visualizador de gabinetes y ocupación general.</p>
        </div>

    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="bg-slate-900/90 backdrop-blur-md border-t border-slate-800 fixed bottom-0 left-0 right-0 py-2.5 px-6 flex justify-around items-center z-50">
        <button onclick="switchView('consultar', this)" class="nav-btn flex flex-col items-center text-blue-400 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Buscar</span>
        </button>
        <button onclick="switchView('registrar', this)" class="nav-btn flex flex-col items-center text-slate-400 hover:text-slate-200 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Registrar</span>
        </button>
        <button onclick="switchView('racks', this)" class="nav-btn flex flex-col items-center text-slate-400 hover:text-slate-200 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            <span class="text-[10px] mt-1 font-medium">Racks</span>
        </button>
    </nav>

    <!-- Scripts de Conexión y Control -->
    <script src="../data/cloud-db.js"></script>
    <script src="js/red.js"></script>
</body>
</html>
